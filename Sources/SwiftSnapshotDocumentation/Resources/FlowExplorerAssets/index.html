<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flow Explorer</title>
  <style>
    :root {
      --bg: #ffffff; --ink: #1e1e1e; --muted: #8a8a8f; --line: #e6e6e9;
      --accent: #0d99ff; --hover: #f3f4f6; --sel: #eef5ff; --canvas: #f6f6f8; --dot: #d6d6dc;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; color: var(--ink); background: var(--bg);
           font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
           display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }

    /* Top bar */
    #topbar { height: 48px; flex: none; display: flex; align-items: center; gap: 16px;
              padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--bg); }
    #topbar .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; }
    #topbar .brand .mark { width: 16px; height: 16px; border-radius: 5px;
                           background: linear-gradient(135deg, #0d99ff, #7b61ff); }
    #toolbar { margin-left: auto; display: flex; align-items: center; gap: 18px; }
    .group { display: flex; align-items: center; gap: 8px; }
    .glabel { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .seg { display: inline-flex; background: #f0f0f2; border-radius: 8px; padding: 2px; }
    .seg button { border: 0; background: transparent; padding: 4px 12px; font: inherit; font-size: 12px;
                  font-weight: 500; color: #5b5b62; cursor: pointer; border-radius: 6px; transition: .12s; }
    .seg button.on { background: var(--accent); color: #fff; box-shadow: 0 1px 2px rgba(13,153,255,.35); }

    /* Body */
    #content { flex: 1; display: flex; min-height: 0; }
    #sidebar { width: 232px; flex: none; border-right: 1px solid var(--line); padding: 12px 10px; overflow: auto; }
    #sidebar .side-h { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
                       padding: 4px 8px; }
    #features { list-style: none; margin: 6px 0 0; padding: 0; }
    #features li { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px;
                   cursor: pointer; color: #2c2c31; }
    #features li::before { content: ""; width: 13px; height: 13px; border-radius: 3px;
                           border: 1.5px solid #c7c7cd; flex: none; }
    #features li:hover { background: var(--hover); }
    #features li.active { background: var(--sel); color: #0b6dd6; }
    #features li.active::before { border-color: var(--accent); background: var(--accent); }

    #main { flex: 1; position: relative; min-width: 0; }
    #cy { position: absolute; inset: 0; background-color: var(--canvas);
          background-image: radial-gradient(var(--dot) 1.1px, transparent 1.1px); background-size: 22px 22px; }

    /* Zoom control */
    #zoombar { position: absolute; left: 16px; bottom: 16px; display: flex; align-items: center; gap: 2px;
               background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 3px;
               box-shadow: 0 4px 14px rgba(0,0,0,.08); user-select: none; }
    #zoombar button { border: 0; background: transparent; width: 28px; height: 26px; border-radius: 7px;
                      font-size: 15px; color: #444; cursor: pointer; }
    #zoombar button:hover { background: var(--hover); }
    #zoombar #zoompct { min-width: 46px; text-align: center; font-size: 12px; color: #555; cursor: pointer; }
    #zoombar .div { width: 1px; height: 18px; background: var(--line); margin: 0 2px; }

    /* Inspector panel */
    #panel { position: absolute; top: 0; right: 0; width: 320px; height: 100%; background: #fff;
             border-left: 1px solid var(--line); padding: 0; overflow: auto; transform: translateX(100%);
             transition: transform .18s ease; box-shadow: -8px 0 24px rgba(0,0,0,.06); }
    #panel.open { transform: translateX(0); }
    #panel .phead { position: sticky; top: 0; background: #fff; padding: 14px 16px; border-bottom: 1px solid var(--line);
                    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    #panel h2 { margin: 0; font-size: 14px; font-weight: 600; }
    #panel .pdesc { color: var(--muted); margin: 3px 0 0; font-size: 12px; }
    #panel .close { cursor: pointer; color: var(--muted); font-size: 14px; line-height: 1; padding: 2px 4px; }
    #panel .pbody { padding: 14px 16px; }
    #panel .callout { background: #f6f8ff; border: 1px solid #e2e9ff; border-radius: 8px; padding: 8px 10px;
                      font-size: 12px; margin-bottom: 12px; }
    #panel .variant-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
                            margin: 12px 0 5px; }
    #panel img { width: 100%; border: 1px solid var(--line); border-radius: 12px; display: block; }
  </style>
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="mark"></span> Flow Explorer</div>
    <div id="toolbar"></div>
  </header>
  <div id="content">
    <aside id="sidebar"><div class="side-h">Features</div><ul id="features"></ul></aside>
    <main id="main">
      <div id="cy"></div>
      <div id="zoombar"></div>
      <div id="panel">
        <div class="phead"><div><h2 id="ptitle"></h2><div class="pdesc" id="pdesc"></div></div>
          <span class="close" onclick="closePanel()">✕</span></div>
        <div class="pbody" id="panel-body"></div>
      </div>
    </main>
  </div>
  <script src="vendor/cytoscape.min.js"></script>
  <script src="vendor/dagre.min.js"></script>
  <script src="vendor/cytoscape-dagre.js"></script>
  <script src="manifest.js"></script>
  <script src="app.js"></script>
</body>
</html>
